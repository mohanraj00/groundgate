<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>groundgate gold check</title>
<style>
:root {
  --bg: #fff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --panel: #f6f8fa;
  --ok: #1a7f37; --ok-bg: #dafbe1; --bad: #cf222e; --bad-bg: #ffe2e0;
  --draft: #0969da; --draft-bg: #ddf4ff; --focus-bg: #fff1b8; --warn: #9a6700;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --panel: #151b23;
    --ok: #3fb950; --ok-bg: #12361f; --bad: #f85149; --bad-bg: #4a1519;
    --draft: #4493f8; --draft-bg: #0c2d4d; --focus-bg: #4a3b0a; --warn: #d29922;
  }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
  color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; gap: 12px; align-items: center; padding: 8px 14px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header select { font: inherit; padding: 3px 6px; max-width: 320px; }
header .grow { flex: 1; }
header a { color: var(--draft); }
.muted { color: var(--muted); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--ok); color: #fff; border-color: var(--ok); }
button.on-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
button.on-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
#doc { margin: 0; padding: 16px 20px 50vh; overflow: auto; white-space: pre-wrap;
  overflow-wrap: anywhere; font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  border-right: 1px solid var(--line); }
#doc mark { color: inherit; border-radius: 2px; background: var(--draft-bg);
  box-shadow: inset 0 -2px var(--draft); }
#doc mark.confirmed { background: var(--ok-bg); box-shadow: inset 0 -2px var(--ok); }
#doc mark.rejected { background: var(--bad-bg); box-shadow: inset 0 -2px var(--bad); }
#doc mark.focus { background: var(--focus-bg); outline: 2px solid var(--warn); }
#doc .pagebreak { display: block; border-top: 1px dashed var(--line); margin: 8px 0; }
#panel { overflow: auto; padding: 10px 14px 40vh; background: var(--panel); }
.field { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px; }
.field h3 { margin: 0; font: 600 13px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
.field .desc { margin: 2px 0 8px; color: var(--muted); font-size: 12.5px; }
.fact { border-left: 3px solid var(--draft); padding: 6px 8px; margin: 6px 0; border-radius: 4px; }
.fact.confirmed { border-left-color: var(--ok); }
.fact.rejected { border-left-color: var(--bad); opacity: .75; }
.fact.focus { background: var(--focus-bg); }
.fact .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fact select.key { font: inherit; max-width: 100%; margin-top: 4px; }
.fact select.key.missing { outline: 2px solid var(--bad); }
.fact input { font: 600 14px ui-monospace, Menlo, monospace; width: 9em; padding: 2px 5px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; font-size: 12px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; cursor: pointer;
  background: var(--bg); }
.chip.ev { border-color: var(--ok); }
.chip.other { border-style: dashed; color: var(--muted); }
.absent { padding: 6px 8px; border-left: 3px solid var(--draft); border-radius: 4px; }
.absent.confirmed { border-left-color: var(--ok); }
.excluded { color: var(--warn); font-size: 12.5px; }
#help { font-size: 12px; }
#toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 6px 12px; border-radius: 6px; display: none; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px;
  padding: 0 4px; }
</style>
</head>
<body>
<header>
  <strong>Gold check</strong>
  <select id="pick" aria-label="Document"></select>
  <span id="progress" class="muted"></span>
  <a id="source" target="_blank" rel="noopener" hidden>Original ↗</a>
  <span class="grow"></span>
  <span id="help" class="muted"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>y</kbd> correct ·
    <kbd>n</kbd> wrong · <kbd>a</kbd> confirm absent · select text + <kbd>+</kbd> add</span>
  <span id="timer" class="muted"></span>
  <button id="done" class="primary">Mark document checked</button>
</header>
<main>
  <pre id="doc"></pre>
  <div id="panel"></div>
</main>
<div id="toast" role="status"></div>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
let state = null;      // {id, text, gold, idx}
let focus = null;      // {kind: "fact"|"absent", key}
let dirty = false, seconds = 0, saveTimer = null;
const expanded = new Set();  // facts whose every other occurrence is listed

function api(path, body) {
  const opts = {headers: {"X-Label-Token": TOKEN, "Content-Type": "application/json"}};
  if (body) { opts.method = "POST"; opts.body = JSON.stringify(body); }
  return fetch(path, opts).then(async (r) => {
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    return data;
  });
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 2500);
}

// UTF-8 byte offsets (the gold's unit) <-> JS string indices
function buildIndex(text) {
  const b2j = new Map(), j2b = new Array(text.length + 1);
  let b = 0;
  for (let j = 0; j < text.length;) {
    const cp = text.codePointAt(j), units = cp > 0xffff ? 2 : 1;
    b2j.set(b, j);
    for (let u = 0; u < units; u++) j2b[j + u] = b;
    b += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
    j += units;
  }
  b2j.set(b, text.length); j2b[text.length] = b;
  return {b2j, j2b};
}

async function loadList(select) {
  const docs = await api("/api/docs");
  const pick = $("#pick"); pick.textContent = "";
  let checked = 0;
  for (const d of docs) {
    const o = document.createElement("option");
    o.value = d.id;
    o.textContent = `${d.checked ? "✓" : d.open ? "•" : "○"} ${d.id} (${d.facts} facts${d.open ? `, ${d.open} open` : ""})`;
    pick.append(o); if (d.checked) checked++;
  }
  $("#progress").textContent = `${checked} of ${docs.length} checked`;
  const first = select || (docs.find((d) => !d.checked) || docs[0]).id;
  pick.value = first;
  return first;
}

async function open(id) {
  if (dirty) await save(false);
  const {gold, text, source} = await api(`/api/doc/${encodeURIComponent(id)}`);
  $("#source").hidden = !source; if (source) $("#source").href = source;
  state = {id, gold, text, idx: buildIndex(text)};
  focus = null; seconds = 0; dirty = false; expanded.clear();
  render(); moveFocus(1);
}

function occurrences(value) {
  // every place the number is written in the text, as byte spans
  const [int, frac] = value.replace(/,/g, "").split(".");
  const grouped = Number(int).toLocaleString("en-US") + (frac ? "." + frac : "");
  const plain = int + (frac ? "." + frac : "");
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(`(?<![\\d.,])\\$?(?:${esc(grouped)}|${esc(plain)})(?![\\d]|[.,]\\d)`, "g");
  const out = [];
  for (const m of state.text.matchAll(re)) {
    out.push({start: state.idx.j2b[m.index], end: state.idx.j2b[m.index + m[0].length]});
  }
  return out;
}
const sameSpan = (a, b) => a.start === b.start && a.end === b.end;
const overlaps = (a, b) => a.start < b.end && b.start < a.end;

function render() {
  const {gold, text, idx} = state;
  // document with evidence highlighted
  const marks = [];
  gold.facts.forEach((f, i) => f.evidence.forEach((e) => marks.push({...e, fact: i, status: f.status})));
  const bounds = new Set([0, text.length]);
  for (const m of marks) { bounds.add(idx.b2j.get(m.start)); bounds.add(idx.b2j.get(m.end)); }
  const cuts = [...bounds].filter((x) => x !== undefined).sort((a, b) => a - b);
  const doc = $("#doc"); doc.textContent = "";
  for (let k = 0; k + 1 < cuts.length; k++) {
    const [a, b] = [cuts[k], cuts[k + 1]], chunk = text.slice(a, b);
    const cover = marks.filter((m) => idx.b2j.get(m.start) <= a && b <= idx.b2j.get(m.end));
    let node;
    if (cover.length) {
      node = document.createElement("mark");
      const st = cover.some((m) => m.status === "draft") ? "draft"
        : cover.some((m) => m.status === "confirmed") ? "confirmed" : "rejected";
      node.className = st; node.dataset.facts = cover.map((m) => m.fact).join(",");
      node.title = [...new Set(cover.map((m) => { const f = gold.facts[m.fact];
        return f.field + (f.key ? ` [${f.key}]` : "") + " = " + f.value; }))].join("\n");
      node.addEventListener("click", () => setFocus({kind: "fact", key: cover[0].fact}, true));
    } else node = document.createElement("span");
    appendText(node, chunk); doc.append(node);
  }
  // fields panel
  const panel = $("#panel"); panel.textContent = "";
  for (const [name, spec] of Object.entries(gold.fields)) {
    const card = el("div", "field"); card.id = "field-" + name;
    const h = el("h3"); h.textContent = `${name}  [${spec.schema.unit || "no unit"}]` +
      (spec.schema.multiple ? "  (one per value)" : "") + (spec.schema.keys ? "  (one per key)" : "");
    const d = el("div", "desc"); d.textContent = spec.description;
    card.append(h, d);
    if (gold.excluded[name] !== undefined) {
      const x = el("div", "excluded"); x.textContent = "Excluded from scoring: " + gold.excluded[name];
      card.append(x, button("Include again", () => { delete gold.excluded[name]; changed(); }));
      panel.append(card); continue;
    }
    gold.facts.forEach((f, i) => { if (f.field === name) card.append(factRow(f, i)); });
    if (gold.absent[name] !== undefined) card.append(absentRow(name));
    const tools = el("div", "row chips");
    tools.append(button("+ Add from selection", () => addFromSelection(name)),
      button("Exclude as ambiguous", () => {
        const why = prompt("Why is this field ambiguous for this document?");
        if (why) { gold.excluded[name] = why; changed(); }
      }));
    if (gold.absent[name] === undefined && !gold.facts.some((f) => f.field === name && f.status !== "rejected"))
      tools.append(button("Not in document", () => { gold.absent[name] = "confirmed"; changed(); }));
    card.append(tools);
    panel.append(card);
  }
  applyFocus();
}
function appendText(node, chunk) {
  const parts = chunk.split("\f");
  parts.forEach((p, i) => {
    if (i) { const br = el("span", "pagebreak"); br.textContent = "\f"; node.append(br); }
    node.append(document.createTextNode(p));
  });
}
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function button(label, fn, cls) {
  const b = el("button", cls); b.type = "button"; b.textContent = label;
  b.addEventListener("click", (ev) => { ev.stopPropagation(); fn(); }); return b;
}

function factRow(f, i) {
  const row = el("div", "fact " + f.status); row.dataset.fact = i;
  row.addEventListener("click", () => setFocus({kind: "fact", key: i}, true));
  const top = el("div", "row");
  const input = el("input"); input.value = f.value; input.setAttribute("aria-label", "value");
  input.addEventListener("change", () => { f.value = input.value.trim(); changed(); });
  top.append(input,
    button("✓ correct", () => { f.status = "confirmed"; changed(); moveFocus(1); }, f.status === "confirmed" ? "on-ok" : ""),
    button("✗ wrong", () => { f.status = "rejected"; changed(); moveFocus(1); }, f.status === "rejected" ? "on-bad" : ""));
  const chips = el("div", "chips");
  f.evidence.forEach((e, k) => {
    const c = el("span", "chip ev"); c.textContent = "“" + snippet(e) + "” ×";
    c.title = "evidence; click × to remove";
    c.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (ev.offsetX > c.offsetWidth - 14) { f.evidence.splice(k, 1); changed(); } else scrollTo(e);
    });
    chips.append(c);
  });
  const others = occurrences(f.value).filter((o) => !f.evidence.some((e) => overlaps(e, o)));
  const shown = expanded.has(i) ? others : others.slice(0, 4);
  for (const o of shown) {
    const c = el("span", "chip other"); c.textContent = "+ " + context(o);
    c.title = "the same number elsewhere: add it as valid evidence";
    c.addEventListener("click", (ev) => { ev.stopPropagation(); f.evidence.push(o); changed(); });
    c.addEventListener("mouseenter", () => scrollTo(o));
    chips.append(c);
  }
  if (shown.length < others.length) {
    const more = el("span", "chip other"); more.textContent = `${others.length - shown.length} more`;
    more.addEventListener("click", (ev) => { ev.stopPropagation(); expanded.add(i); render(); });
    chips.append(more);
  }
  const keys = state.gold.fields[f.field].schema.keys;
  if (keys) {
    const pick = el("select", "key" + (keys.includes(f.key) ? "" : " missing"));
    pick.setAttribute("aria-label", "key");
    for (const k of ["", ...keys]) {
      const o = el("option"); o.value = k; o.textContent = k || "Pick the key this value belongs to";
      o.selected = (f.key || "") === k; pick.append(o);
    }
    pick.addEventListener("click", (ev) => ev.stopPropagation());
    pick.addEventListener("change", () => { f.key = pick.value || null; changed(); });
    row.append(top, pick, chips);
  } else row.append(top, chips);
  return row;
}
function absentRow(name) {
  const st = state.gold.absent[name];
  const row = el("div", "absent " + st); row.dataset.absent = name;
  row.addEventListener("click", () => setFocus({kind: "absent", key: name}, false));
  const t = el("span"); t.textContent = st === "confirmed" ? "Not in the document (confirmed) " : "Draft: not in the document ";
  row.append(t,
    button("✓ confirm absent", () => { state.gold.absent[name] = "confirmed"; changed(); moveFocus(1); }, st === "confirmed" ? "on-ok" : ""),
    button("It is there", () => { delete state.gold.absent[name]; changed(); toast("Select the value in the document, then press +"); }));
  return row;
}
function snippet(e) {
  const {b2j} = state.idx; return state.text.slice(b2j.get(e.start), b2j.get(e.end));
}
function context(e) {
  const {b2j} = state.idx, a = b2j.get(e.start), b = b2j.get(e.end);
  return (state.text.slice(Math.max(0, a - 28), a) + "[" + state.text.slice(a, b) + "]" +
    state.text.slice(b, b + 20)).replace(/\s+/g, " ");
}
function scrollTo(e) {
  const a = state.idx.b2j.get(e.start);
  for (const m of document.querySelectorAll("#doc mark, #doc span")) {
    if (m._start === undefined) indexNodes();
    if (m._start <= a && a < m._end) { m.scrollIntoView({block: "center"}); m.classList.add("focus"); setTimeout(() => m.classList.remove("focus"), 900); return; }
  }
}
function indexNodes() {
  let pos = 0;
  for (const m of $("#doc").children) { m._start = pos; pos += m.textContent.length; m._end = pos; }
}

function selectionSpan() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0), doc = $("#doc");
  if (!doc.contains(r.startContainer) || !doc.contains(r.endContainer)) return null;
  const pos = (node, off) => {
    const w = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
    let n = 0;
    while (w.nextNode()) { if (w.currentNode === node) return n + off; n += w.currentNode.length; }
    return n;
  };
  let a = pos(r.startContainer, r.startOffset), b = pos(r.endContainer, r.endOffset);
  while (a < b && /\s/.test(state.text[a])) a++;
  while (b > a && /\s/.test(state.text[b - 1])) b--;
  return a < b ? {start: state.idx.j2b[a], end: state.idx.j2b[b], text: state.text.slice(a, b)} : null;
}
function addFromSelection(name) {
  const s = selectionSpan();
  if (!s) { toast("Select the value in the document first"); return; }
  const m = s.text.match(/[-−]?\d[\d,]*(?:\.\d+)?/);
  const value = m ? m[0].replace(/,/g, "").replace("−", "-") : "";
  const gold = state.gold;
  delete gold.absent[name];
  const fact = {id: "p" + Date.now(), field: name, value, unit: gold.fields[name].schema.unit,
                evidence: [{start: s.start, end: s.end}], status: "confirmed"};
  if (gold.fields[name].schema.keys) { fact.key = null; toast("Pick the key for the new value"); }
  gold.facts.push(fact);
  window.getSelection().removeAllRanges();
  changed(); setFocus({kind: "fact", key: gold.facts.length - 1}, true);
}

function targets() {
  const out = [];
  for (const name of Object.keys(state.gold.fields)) {
    state.gold.facts.forEach((f, i) => { if (f.field === name) out.push({kind: "fact", key: i}); });
    if (state.gold.absent[name] !== undefined) out.push({kind: "absent", key: name});
  }
  return out;
}
function moveFocus(step) {
  const t = targets(); if (!t.length) return;
  let i = focus ? t.findIndex((x) => x.kind === focus.kind && x.key === focus.key) : -1;
  if (i < 0 && step > 0) {  // first undecided item
    i = t.findIndex((x) => x.kind === "fact" ? state.gold.facts[x.key].status === "draft" : state.gold.absent[x.key] === "draft");
    if (i >= 0) return setFocus(t[i], true);
  }
  i = Math.min(t.length - 1, Math.max(0, i + step));
  setFocus(t[i], true);
}
function setFocus(f, scroll) { focus = f; applyFocus(scroll); }
function applyFocus(scroll) {
  document.querySelectorAll(".focus").forEach((e) => e.classList.remove("focus"));
  if (!focus) return;
  const sel = focus.kind === "fact" ? `[data-fact="${focus.key}"]` : `[data-absent="${focus.key}"]`;
  const row = document.querySelector(sel); if (!row) return;
  row.classList.add("focus");
  if (scroll) row.scrollIntoView({block: "nearest"});
  if (focus.kind === "fact") {
    for (const m of document.querySelectorAll("#doc mark")) {
      if (m.dataset.facts.split(",").includes(String(focus.key))) {
        m.classList.add("focus"); if (scroll) m.scrollIntoView({block: "center"}); scroll = false;
      }
    }
  }
}

function changed() { dirty = true; render(); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 600); }
async function save(done) {
  clearTimeout(saveTimer);
  const spent = seconds; seconds = 0;
  try {
    await api(`/api/doc/${encodeURIComponent(state.id)}`, {gold: state.gold, done, seconds: spent});
    dirty = false;
    if (done) { toast("Checked. Next document."); await open(await loadList()); }
    else await loadList(state.id);
  } catch (e) { seconds += spent; toast(e.message); }
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
  const cur = focus;
  if (e.key === "j") moveFocus(1);
  else if (e.key === "k") moveFocus(-1);
  else if (e.key === "y" && cur?.kind === "fact") { state.gold.facts[cur.key].status = "confirmed"; changed(); moveFocus(1); }
  else if (e.key === "n" && cur?.kind === "fact") { state.gold.facts[cur.key].status = "rejected"; changed(); moveFocus(1); }
  else if (e.key === "a" && cur?.kind === "absent") { state.gold.absent[cur.key] = "confirmed"; changed(); moveFocus(1); }
  else if (e.key === "+" || e.key === "=") {
    const name = cur ? (cur.kind === "fact" ? state.gold.facts[cur.key].field : cur.key) : null;
    if (name) addFromSelection(name); else toast("Focus a field first (j/k)");
  } else return;
  e.preventDefault();
});
$("#pick").addEventListener("change", (e) => open(e.target.value));
$("#done").addEventListener("click", () => save(true));
setInterval(() => {
  if (document.visibilityState === "visible" && state) {
    seconds++;
    const t = (state.gold.seconds_spent || 0) + seconds;
    $("#timer").textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")} on this doc`;
  }
}, 1000);
window.addEventListener("beforeunload", () => { if (dirty) save(false); });
loadList().then(open).catch((e) => toast(e.message));
</script>
</body>
</html>
