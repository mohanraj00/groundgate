<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fields labels</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e0d8;
  --now: #ffd84d; --now-ink: #1d1d1b; --done: #d9efe0; --todo: #c76b00; --unsure: #f3d9f0;
  --accent: #2456c9; --on: #2456c9; --on-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a19; --panel: #232322; --ink: #e9e7e1; --muted: #9b9890; --line: #3a3936;
    --now: #ffd84d; --now-ink: #1d1d1b; --done: #24442f; --todo: #f0a040; --unsure: #4a2d47;
    --accent: #7ea2ff; --on: #4c78e8; --on-ink: #ffffff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }
#doc { overflow-y: auto; padding: 24px 40px 60vh; }
#doc h2, #doc h3, #doc h4, #doc h5, #doc h6 { margin: 1.4em 0 .4em; line-height: 1.3; }
#doc h2 { font-size: 20px; } #doc h3 { font-size: 17px; } #doc h4, #doc h5, #doc h6 { font-size: 15px; }
#doc section section { margin-left: 4px; }
#doc p { margin: .5em 0; }
#doc table { border-collapse: collapse; margin: .8em 0; font-size: 14px; }
#doc td, #doc th { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
#doc mark { background: transparent; color: inherit; cursor: pointer; border-radius: 3px;
  outline: 2px dashed var(--todo); outline-offset: 1px; padding: 0 1px; }
#doc mark.done { outline: none; background: var(--done); }
#doc mark.unsure { outline: none; background: var(--unsure); }
#doc mark.done::after, #doc mark.unsure::after { content: attr(data-tag); font-size: 10px;
  vertical-align: super; color: var(--muted); margin-left: 2px; }
#doc mark.now { background: var(--now); color: var(--now-ink); outline: 3px solid var(--now);
  font-weight: 700; }
.docname { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
aside { border-left: 1px solid var(--line); background: var(--panel); padding: 20px;
  overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.progress { font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); }
.dose { font-size: 13px; color: var(--muted); }
.dose b { font-size: 22px; color: var(--ink); }
.q { font-weight: 600; }
button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; text-align: left; cursor: pointer; width: 100%; }
button:hover { border-color: var(--accent); }
.field { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.field .k { font-weight: 700; }
.field .n { font-weight: 600; }
.field .d { grid-column: 2; font-size: 13px; color: var(--muted); }
.field.on { background: var(--on); color: var(--on-ink); border-color: var(--on); }
.field.on .d { color: var(--on-ink); opacity: .85; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); text-align: center;
  font-weight: 600; }
.saved { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px;
  padding: 0 4px; background: var(--bg); }
@media (max-width: 800px) {
  .wrap { grid-template-columns: 1fr; height: auto; }
  #doc { padding: 16px; height: 60vh; }
  aside { border-left: none; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="wrap">
  <main id="doc"></main>
  <aside>
    <div>
      <div class="progress" id="progress"></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
    <div class="dose" id="dose"></div>
    <a class="dose" id="pdf" target="_blank" hidden>Open this page of the PDF</a>
    <div class="q">Which fields does the text state as the yellow dose?</div>
    <div id="fields"></div>
    <div class="row">
      <button id="none">0 &nbsp;None of them</button>
      <button id="unsure">? &nbsp;Not sure</button>
    </div>
    <button class="primary" id="save">Save and go to next (Enter)</button>
    <div class="saved" id="saved"></div>
    <div class="row">
      <button id="prev">&larr; Back</button>
      <button id="todo">Next unlabeled (u)</button>
    </div>
    <div class="keys">
      <kbd>1</kbd>&ndash;<kbd>4</kbd> select or clear a field, <kbd>Enter</kbd> save the selection<br>
      <kbd>0</kbd> none and next, <kbd>?</kbd> not sure and next<br>
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> back and forward, <kbd>u</kbd> next unlabeled<br>
      Click a dose in the text to go to it. A dashed box is not labeled yet.
    </div>
  </aside>
</div>
<script>
let S = null, at = 0, pick = new Set(), shown = null;
const $ = (id) => document.getElementById(id);
const short = { starting_dose: "start", max_daily_dose: "max", hepatic_starting_dose: "hepatic",
  strengths: "strength" };

function tag(v) {
  if (v === null) return "?";
  if (!v.length) return "none";
  return v.map((f) => short[f] || f).join(", ");
}

async function load() {
  S = await (await fetch("/state")).json();
  S.fields.forEach((f, i) => {
    const b = document.createElement("button");
    b.className = "field"; b.dataset.name = f.name;
    b.innerHTML = `<span class="k">${i + 1}</span><span class="n">${f.name}</span>` +
      `<span class="d">${f.description}</span>`;
    b.onclick = () => toggle(f.name);
    $("fields").appendChild(b);
  });
  const first = S.items.findIndex((it) => !(it.id in S.labels));
  await go(first < 0 ? 0 : first);
}

function paintMarks() {
  document.querySelectorAll("#doc mark").forEach((m) => {
    const has = m.id in S.labels, v = S.labels[m.id];
    m.classList.toggle("done", has && v !== null);
    m.classList.toggle("unsure", has && v === null);
    m.classList.toggle("now", m.id === S.items[at].id);
    m.dataset.tag = has ? tag(v) : "";
  });
}

async function go(j) {
  at = Math.max(0, Math.min(S.items.length - 1, j));
  const it = S.items[at];
  const fresh = shown !== it.doc;
  if (fresh) {
    $("doc").innerHTML = `<div class="docname">${it.doc.replace("fda-", "")}</div>` +
      await (await fetch("/doc/" + it.doc)).text();
    document.querySelectorAll("#doc mark").forEach((m) => {
      m.onclick = () => go(S.items.findIndex((x) => x.id === m.id));
    });
    shown = it.doc;
  }
  const v = S.labels[it.id];
  pick = new Set(v || []);
  paintMarks();
  const m = document.getElementById(it.id);
  m.scrollIntoView({ block: "center", behavior: fresh ? "instant" : "smooth" });
  const inDoc = S.items.filter((x) => x.doc === it.doc);
  const done = S.items.filter((x) => x.id in S.labels).length;
  $("progress").textContent = `${done} of ${S.items.length} labeled. This is dose ${at + 1}.`;
  $("bar").style.width = `${(100 * done) / S.items.length}%`;
  $("dose").innerHTML = `<b>${m.textContent}</b> &nbsp;dose ${inDoc.indexOf(it) + 1} of ` +
    `${inDoc.length} in ${it.doc.replace("fda-", "")}`;
  $("saved").textContent = it.id in S.labels ? `Saved now: ${tag(v)}` : "Not labeled yet.";
  $("pdf").hidden = !(S.pdf && it.page);
  if (S.pdf && it.page) $("pdf").href = `/pdf/${it.doc}#page=${it.page}`;
  paintFields();
}

function paintFields() {
  document.querySelectorAll(".field").forEach((b) => b.classList.toggle("on", pick.has(b.dataset.name)));
}

function toggle(name) {
  pick.has(name) ? pick.delete(name) : pick.add(name);
  paintFields();
}

async function save(value) {
  const r = await fetch("/label", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: S.items[at].id, value }) });
  if (!r.ok) { $("saved").textContent = "Not saved. Look at the terminal."; return; }
  S.labels = (await r.json()).labels;
  await go(at + 1);
}

$("none").onclick = () => save([]);
$("unsure").onclick = () => save(null);
$("save").onclick = () => pick.size ? save([...pick]) : ($("saved").textContent =
  "Select a field, or press 0 for none.");
$("prev").onclick = () => go(at - 1);
$("todo").onclick = () => {
  const n = S.items.findIndex((x, i) => i > at && !(x.id in S.labels));
  const any = S.items.findIndex((x) => !(x.id in S.labels));
  go(n >= 0 ? n : any >= 0 ? any : at);
};
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = Number(e.key);
  if (n >= 1 && n <= S.fields.length) toggle(S.fields[n - 1].name);
  else if (e.key === "0") save([]);
  else if (e.key === "?") save(null);
  else if (e.key === "Enter") { e.preventDefault(); $("save").click(); }
  else if (e.key === "ArrowLeft") go(at - 1);
  else if (e.key === "ArrowRight") go(at + 1);
  else if (e.key === "u") $("todo").click();
  else return;
  e.preventDefault();
});
load();
</script>
</body>
</html>
