[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "groundgate"
version = "0.0.1"
description = "Deterministic admission for LLM-extracted facts: admit, flag for verification, or reject, with receipts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohan Raj" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
keywords = ["llm", "extraction", "grounding", "verification", "langextract"]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20231228"]
langextract = ["langextract>=1.0"]

[project.scripts]
groundgate = "groundgate.cli:main"

[project.urls]
Repository = "https://github.com/mohanraj00/groundgate"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.6",
  "rfc8785>=0.1.4",
  "pdfminer.six>=20231228",
]
langextract = ["langextract>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/groundgate"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["pdfgen"]

[tool.ruff.lint.per-file-ignores]
"conformance/build.py" = ["E501"]  # vector data reads better unwrapped

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["groundgate"]
branch = true
