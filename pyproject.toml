[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "groundgate"
dynamic = ["version", "readme"]
description = "Deterministic admission for LLM-extracted facts: admit, flag for verification, or reject, with receipts."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohan Raj" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
keywords = ["llm", "extraction", "grounding", "verification", "langextract"]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20231228"]
langextract = ["langextract>=1.0"]

[project.scripts]
groundgate = "groundgate.cli:main"

[project.urls]
Repository = "https://github.com/mohanraj00/groundgate"
Documentation = "https://github.com/mohanraj00/groundgate/blob/main/docs/guide.md"
Specification = "https://github.com/mohanraj00/groundgate/blob/main/SPEC.md"
Changelog = "https://github.com/mohanraj00/groundgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/mohanraj00/groundgate/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.6",
  "rfc8785>=0.1.4",
  "pdfminer.six>=20231228",
]
langextract = ["langextract>=1.0"]

[tool.hatch.version]
path = "src/groundgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/groundgate"]

[tool.hatch.build.targets.sdist]
# the library, its spec and its conformance suite; the benchmark and examples stay in the repo
include = ["/src", "/tests", "/conformance", "/SPEC.md", "/CHANGELOG.md", "/README.md", "/LICENSE"]
exclude = ["/tests/test_bench.py"]

# PyPI renders the README without the repo around it, so relative links point at GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/mohanraj00/groundgate/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/mohanraj00/groundgate/blob/main/\1)'

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["pdfgen"]

[tool.ruff.lint.per-file-ignores]
"conformance/build.py" = ["E501"]  # vector data reads better unwrapped
"bench/gold/prelabels.py" = ["E501", "RUF001"]  # contexts are copied verbatim from documents

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["groundgate"]
branch = true
