<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration labels</title>
<link rel="stylesheet" href="/label.css">
</head>
<body>
<div class="wrap">
  <main id="doc"><div class="docname" id="docname"></div><div id="text"></div></main>
  <aside>
    <div>
      <div class="progress" id="progress"></div>
      <div class="bar"><div id="bar"></div></div>
    </div>
    <div class="item" id="item"></div>
    <a class="item" id="link" target="_blank" rel="noopener" hidden>Open the original document</a>
    <div class="q" id="q"></div>
    <div class="desc" id="desc"></div>
    <div id="opts"></div>
    <div class="row" id="answers"></div>
    <button class="primary" id="save" hidden>Save and go to next (Enter)</button>
    <div class="saved" id="saved"></div>
    <div class="row">
      <button id="prev">&larr; Back</button>
      <button id="todo">Next unlabeled (u)</button>
    </div>
    <div class="keys" id="keys"></div>
  </aside>
</div>
<script src="/label.js"></script>
</body>
</html>
