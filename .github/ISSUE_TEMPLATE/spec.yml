name: Spec change
description: Propose a change to how a candidate is decided.
labels: [spec]
body:
  - type: markdown
    attributes:
      value: |
        SPEC.md defines every decision, so a change here ships as a new spec version with new
        conformance vectors. Start from real text that goes wrong.
  - type: textarea
    id: case
    attributes:
      label: The case
      description: The document text, the field (with its schema entry) and the candidate.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What v0.1 decides, and why that's wrong
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule you propose
      description: Which section changes, in the spec's own terms if you can.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: Correct facts it would reject or flag, and rules it interacts with.
