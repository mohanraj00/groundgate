name: Outside PR paths

# A PR from a fork must not change these paths unless the maintainer approved it with the label
# maintainer-approved: .github/, CHANGELOG.md, SPEC.md, conformance/, AGENTS.md and CLAUDE.md.
#
# This workflow uses pull_request_target, so it always comes from main, and a fork PR cannot edit
# it. pull_request_target runs in the context of this repository. Thus:
# - Never check out, build, install or run code from the PR here. Never add actions/checkout.
# - Never put PR data (a title, a branch name, a file name, a label) in the text of a command.
#   PR data goes through env vars only.
# - Keep the token read-only, and give the job no secrets.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  outside-pr-paths:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: A PR from a fork changes no protected path without the label maintainer-approved
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # The label counts only in the run that adding the label starts. Any later event (a
          # push, a reopen, a change to another label) checks the files again without it, so the
          # maintainer adds the label again after reading the new diff.
          APPROVAL_EVENT: >-
            ${{ github.event.action == 'labeled'
            && github.event.label.name == 'maintainer-approved' }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "The PR comes from this repository. Nothing to check."
            exit 0
          fi
          if [ "$APPROVAL_EVENT" = "true" ]; then
            # The maintainer must add the label: the sender of this event, and the actor of the
            # latest "labeled" event for it. The events API can lag, so an empty list is not a
            # refusal when the sender is the maintainer.
            labeler=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "maintainer-approved")
                | .actor.login' | tail -n 1)
            if [ "$SENDER" = "mohanraj00" ] && { [ -z "$labeler" ] || [ "$labeler" = "mohanraj00" ]; }; then
              echo "The maintainer added the label maintainer-approved."
              exit 0
            fi
            echo "::warning::Only the maintainer can add the label maintainer-approved. The job checks the files without it."
          fi
          files="$RUNNER_TEMP/pr-files.jsonl"
          # One JSON array for each file: the path, and the old path of a rename. JSON keeps a
          # newline in a path inside one line, so the log shows it as text and not as a command.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.filename, .previous_filename] | tojson' > "$files"
          listed=$(wc -l < "$files")
          if [ "$listed" -lt "$CHANGED_FILES" ]; then
            echo "::error::The API lists $listed of the $CHANGED_FILES changed files. The maintainer must check this PR and add the label maintainer-approved."
            exit 1
          fi
          pattern='^(\.github/|CHANGELOG\.md$|SPEC\.md$|conformance/|AGENTS\.md$|CLAUDE\.md$)'
          protected=$(jq -c --arg re "$pattern" \
            '.[] | select(. != null) | select(test($re; "i"))' "$files")
          if [ -n "$protected" ]; then
            echo "::error::This PR from a fork changes .github/, CHANGELOG.md, SPEC.md, conformance/, AGENTS.md or CLAUDE.md. These paths need an issue that the maintainer approved, and the label maintainer-approved on the PR. See CONTRIBUTING.md, Outside pull requests."
            echo "The protected paths in this PR:"
            printf '%s\n' "$protected"
            exit 1
          fi
          echo "The PR changes no protected path."
