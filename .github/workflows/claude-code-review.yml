name: Claude Code Review

# Claude reviews the PRs that Codex opens (branch codex/...) and any PR with the label
# review:claude. Codex reviews every PR when it opens. To ask again after a push, comment
# "@claude review" (claude.yml) or "@codex review".

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

jobs:
  claude-review:
    # A PR created with a label sends "opened" and then "labeled", so the label starts a review
    # only on "labeled", and only on a branch that "opened" does not already review.
    if: |
      !github.event.pull_request.draft && (
        (github.event.action != 'labeled' && startsWith(github.event.pull_request.head.ref, 'codex/')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'review:claude' &&
          !startsWith(github.event.pull_request.head.ref, 'codex/')) ||
        ((github.event.action == 'reopened' || github.event.action == 'ready_for_review') &&
          contains(github.event.pull_request.labels.*.name, 'review:claude'))
      )
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first: its "Review guidelines" section
            says what to check and how to report it. Read the issue that the PR body names
            with "Fixes #N", and read the diff with `gh pr diff`.

            Post each finding as an inline comment on its line, with a concrete input that
            fails and its effect. Report only findings that you checked in the code. Then post
            one PR comment with the number of findings, or "No findings." when there are none.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
