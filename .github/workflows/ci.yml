name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Conformance vectors are up to date
        run: uv run python conformance/build.py && git diff --exit-code conformance/
      - name: The example rebuilds byte for byte from its cached model runs
        run: uv run python examples/irs-590a/build.py && git diff --exit-code examples/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The calibration tool builds as its own package, outside the core wheel
        run: |
          uv build --package groundgate-calibrate -o dist-calibrate
          uvx twine check --strict dist-calibrate/*
          ! unzip -l dist/*.whl | grep -q groundgate_calibrate
      - name: The wheel installs into a clean venv, and the quickstart and vectors pass against it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl pytest
          /tmp/clean/bin/groundgate --help > /dev/null
          /tmp/clean/bin/python -m pytest -p no:cacheprovider \
            tests/test_package.py tests/test_readme.py tests/test_conformance.py

  langextract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --group langextract
      - run: uv run --group langextract pytest tests/test_langextract.py tests/test_bench.py
      - name: v0.1 benchmark results rescore byte for byte on the released 0.1.0 wheel
        run: |
          uv export --only-group langextract --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/bench-requirements.txt"
          uv run --isolated --no-project --python 3.12 --with groundgate==0.1.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" python bench/score.py --check
      - name: Set-2 results rescore, spec 0.2 on the released 0.2.0 wheel and spec 0.1 on 0.1.0
        run: |
          uv run --isolated --no-project --python 3.12 --with groundgate==0.2.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" \
            python bench/score.py --set bench/set2 --check
      - name: Pattern-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run --group langextract python bench/patterns/pairs.py score --check
      - name: Dots-set results rescore, spec 0.3 in process
        run: uv run python bench/dots/dots.py score --check
      - name: Caps-set results rescore, spec 0.3 in process
        run: uv run python bench/caps/caps.py score --check
      - name: Keys-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/keys/keys.py score --check
      - name: Tables-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/tables/tables.py score --check
      - name: Status-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/status/status.py score --check
      - name: India-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/india/india.py score --check
      - name: Evidence-list measure results match the recorded decisions and labels
        run: uv run python bench/evidence/measure.py results --check
      - name: Held-out 10-K set results match the recorded decisions and labels
        run: uv run python bench/sec3/measure.py results --check
      - name: Feedback round on the held-out 10-K set matches its recorded decisions and labels
        run: uv run python bench/sec3/feedback.py results --check
      - name: Status-set key calibration report matches its recorded answers, on the 0.6.1 wheel and calibrate 0.2.0
        run: |
          uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.6.1 \
            --with groundgate-calibrate==0.2.0 \
            groundgate-calibrate report --work bench/status/calibrate/work --check
      - name: Model triage report matches its recorded answers
        run: uv run python bench/patterns/triage.py report --check
      - name: Key-judge report matches its recorded answers
        run: uv run python bench/judges/keys/judge.py report --check
      - name: Relation-judge report matches its recorded answers
        run: uv run python bench/judges/relations/judge.py report --check
      - name: Field-judge report matches its recorded answers
        run: uv run python bench/judges/fields/judge.py report --check
      - name: Conflict-judge report matches its recorded answers
        run: uv run python bench/judges/conflicts/judge.py report --check
      - name: Aviation-judge report matches its recorded answers
        run: uv run python bench/judges/aviation/judge.py report --check
      - name: Quote-flag counts and COUNTS.md match the recorded runs, on the 0.4.0 wheel
        run: |
          uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.4.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" \
            python bench/judges/quotes/count.py --check
      - name: The 10-K calibration report and results match their recorded answers, on the 0.4.0 wheel and calibrate 0.1.0
        run: |
          run04="uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.4.0 --with groundgate-calibrate==0.1.0"
          $run04 groundgate-calibrate report --work bench/sec/work-field --check
          $run04 groundgate-calibrate report --work bench/sec/work-key --check
          $run04 python bench/sec/sec.py results --check
