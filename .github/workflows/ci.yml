name: CI

on:
  # A push to any branch runs CI in a fork, so that an outside contributor can link a green run.
  # In this repository, which is not a fork, only a push to main runs it. The scope job decides.
  push:
    branches: ["**"]
  # labeled and unlabeled rerun outside-pr-paths only. The scope job skips the other jobs.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  # The other jobs need this job. If it is skipped, they are skipped too. A skipped check passes a
  # required check of the same name, so the name of each job is an expression. It gives the
  # required name only after this job passed. On a skipped job, GitHub shows the expression text.
  scope:
    if: >-
      (github.event_name == 'pull_request'
      && github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.event.repository.fork))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full CI run for the $GITHUB_EVENT_NAME event"

  lint:
    name: ${{ needs.scope.result == 'success' && 'lint' || 'lint-skipped' }}
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Conformance vectors are up to date
        run: uv run python conformance/build.py && git diff --exit-code conformance/
      - name: The example rebuilds byte for byte from its cached model runs
        run: uv run python examples/irs-590a/build.py && git diff --exit-code examples/

  test:
    name: >-
      ${{ needs.scope.result == 'success' && 'test' || 'test-skipped' }}
      (${{ matrix.os }}, ${{ matrix.python }})
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing

  package:
    name: ${{ needs.scope.result == 'success' && 'package' || 'package-skipped' }} (${{ matrix.os }})
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The calibration tool builds as its own package, outside the core wheel
        run: |
          uv build --package groundgate-calibrate -o dist-calibrate
          uvx twine check --strict dist-calibrate/*
          ! unzip -l dist/*.whl | grep -q groundgate_calibrate
      - name: The wheel installs into a clean venv, and the quickstart and vectors pass against it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl pytest
          /tmp/clean/bin/groundgate --help > /dev/null
          /tmp/clean/bin/python -m pytest -p no:cacheprovider \
            tests/test_package.py tests/test_readme.py tests/test_conformance.py

  langextract:
    name: ${{ needs.scope.result == 'success' && 'langextract' || 'langextract-skipped' }}
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --python 3.12 --group langextract
      - run: uv run --group langextract pytest tests/test_langextract.py tests/test_bench.py
      - name: v0.1 benchmark results rescore byte for byte on the released 0.1.0 wheel
        run: |
          uv export --only-group langextract --no-emit-project --no-hashes \
            -o "$RUNNER_TEMP/bench-requirements.txt"
          uv run --isolated --no-project --python 3.12 --with groundgate==0.1.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" python bench/score.py --check
      - name: Set-2 results rescore, spec 0.2 on the released 0.2.0 wheel and spec 0.1 on 0.1.0
        run: |
          uv run --isolated --no-project --python 3.12 --with groundgate==0.2.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" \
            python bench/score.py --set bench/set2 --check
      - name: Pattern-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run --group langextract python bench/patterns/pairs.py score --check
      - name: Dots-set results rescore, spec 0.3 in process
        run: uv run python bench/dots/dots.py score --check
      - name: Caps-set results rescore, spec 0.3 in process
        run: uv run python bench/caps/caps.py score --check
      - name: Keys-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/keys/keys.py score --check
      - name: Tables-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/tables/tables.py score --check
      - name: Status-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/status/status.py score --check
      - name: India-set results rescore, spec 0.3 in process and spec 0.2 on the 0.2.0 wheel
        run: uv run python bench/india/india.py score --check
      - name: Evidence-list measure results match the recorded decisions and labels
        run: uv run python bench/evidence/measure.py results --check
      - name: Held-out 10-K set results match the recorded decisions and labels
        run: uv run python bench/sec3/measure.py results --check
      - name: Feedback round on the held-out 10-K set matches its recorded decisions and labels
        run: uv run python bench/sec3/feedback.py results --check
      - name: Outside-knowledge results match the recorded items and labels
        run: uv run python bench/outside/outside.py results --check
      - name: Held-out report set results match the recorded decisions and labels
        run: uv run python bench/afr/measure.py results --check
      - name: State ACFR set results match the recorded decisions and labels
        run: uv run python bench/acfr/measure.py results --check
      - name: Causes of the proposals that bench/acfr does not admit (#244) match the recorded causes and labels
        run: uv run python bench/acfr/causes.py results --check
      - name: Runs of bench/acfr without the role key on fields with no keys (#256) match the recorded decisions and labels
        run: uv run python bench/acfr/keyrole.py results --check
      - name: Second state ACFR set (#249) results match the recorded decisions and labels
        run: uv run python bench/acfr2/measure.py results --check
      - name: Held-out report set with PDF table rows (#230) matches its recorded decisions and labels
        run: uv run python bench/afr/tabs.py results --check
      - name: Causes of the field and key failures on the report set (#239) match the recorded causes and labels
        run: uv run python bench/afr/causes.py results --check
      - name: PDF table rows (#246, #247) match the recorded rows and labels
        run: uv run python bench/pdfrows/pdfrows.py results --check
      - name: String set (#140) results match the recorded decisions and labels
        run: uv run python bench/strings/measure.py results --check
      - name: Changed-value test (#322) results match the fixed changes, spec 0.11 in process
        run: uv run python bench/changed/changed.py results --check
      - name: Status-set key calibration report matches its recorded answers, on the 0.6.1 wheel and calibrate 0.2.0
        run: |
          uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.6.1 \
            --with groundgate-calibrate==0.2.0 \
            groundgate-calibrate report --work bench/status/calibrate/work --check
      - name: Review answers against blind labels match the recorded reading and answers
        run: uv run python bench/status/review.py results --check
      - name: Model triage report matches its recorded answers
        run: uv run python bench/patterns/triage.py report --check
      - name: Key-judge report matches its recorded answers
        run: uv run python bench/judges/keys/judge.py report --check
      - name: Relation-judge report matches its recorded answers
        run: uv run python bench/judges/relations/judge.py report --check
      - name: Field-judge report matches its recorded answers
        run: uv run python bench/judges/fields/judge.py report --check
      - name: Conflict-judge report matches its recorded answers
        run: uv run python bench/judges/conflicts/judge.py report --check
      - name: Aviation-judge report matches its recorded answers
        run: uv run python bench/judges/aviation/judge.py report --check
      - name: Quote-flag counts and COUNTS.md match the recorded runs, on the 0.4.0 wheel
        run: |
          uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.4.0 \
            --with-requirements "$RUNNER_TEMP/bench-requirements.txt" \
            python bench/judges/quotes/count.py --check
      - name: The 10-K calibration report and results match their recorded answers, on the 0.4.0 wheel and calibrate 0.1.0
        run: |
          run04="uv run --isolated --no-project --no-sources --python 3.12 --with groundgate==0.4.0 --with groundgate-calibrate==0.1.0"
          $run04 groundgate-calibrate report --work bench/sec/work-field --check
          $run04 groundgate-calibrate report --work bench/sec/work-key --check
          $run04 python bench/sec/sec.py results --check

  # A PR from a fork must not change these paths unless the maintainer approved it with the label
  # maintainer-approved. The job reads the file list from the API and never checks out PR code.
  # All PR data goes through env vars, never into the command text.
  outside-pr-paths:
    name: ${{ github.event_name == 'pull_request' && 'outside-pr-paths' || 'outside-pr-paths-skipped' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: A PR from a fork changes no protected path without the label maintainer-approved
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'maintainer-approved') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "The PR comes from this repository. Nothing to check."
            exit 0
          fi
          if [ "$APPROVED" = "true" ]; then
            echo "The PR has the label maintainer-approved."
            exit 0
          fi
          files="$RUNNER_TEMP/pr-files.jsonl"
          # One JSON array for each file: the path, and the old path of a rename. JSON keeps a
          # newline in a path inside one line, so the log shows it as text and not as a command.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.filename, .previous_filename] | tojson' > "$files"
          listed=$(wc -l < "$files")
          if [ "$listed" -lt "$CHANGED_FILES" ]; then
            echo "::error::The API lists $listed of the $CHANGED_FILES changed files. The maintainer must check this PR and add the label maintainer-approved."
            exit 1
          fi
          protected=$(jq -c '.[] | select(. != null)
            | select(test("^(\\.github/|CHANGELOG\\.md$|SPEC\\.md$|conformance/)"; "i"))' "$files")
          if [ -n "$protected" ]; then
            echo "::error::This PR from a fork changes .github/, CHANGELOG.md, SPEC.md or conformance/. These paths need an issue that the maintainer approved, and the label maintainer-approved on the PR. See CONTRIBUTING.md, Outside pull requests."
            echo "The protected paths in this PR:"
            printf '%s\n' "$protected"
            exit 1
          fi
          echo "The PR changes no protected path."
