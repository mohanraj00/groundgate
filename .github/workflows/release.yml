name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.8"
      - run: uv build --build-constraints .github/release-build-constraints.txt --require-hashes
      - name: The tag matches the package version
        run: test -f "dist/groundgate-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: twine checks the files, installed from hashed requirements
        run: |
          uv venv -q "$RUNNER_TEMP/twine"
          uv pip install -q --python "$RUNNER_TEMP/twine" --require-hashes -r .github/release-twine.txt
          "$RUNNER_TEMP/twine/bin/twine" check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The wheel that will be published passes the quickstart and the vectors
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q --require-hashes -r .github/release-smoke.txt
          /tmp/clean/bin/pip install -q --no-deps --no-index dist/*.whl
          /tmp/clean/bin/python -m pytest -p no:cacheprovider \
            tests/test_package.py tests/test_readme.py tests/test_conformance.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes are the version's CHANGELOG section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " { if (on) exit; on = index($0, "## " v) == 1; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
