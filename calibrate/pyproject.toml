[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "groundgate-calibrate"
dynamic = ["version"]
description = "Measure a judge's thresholds for groundgate on your own documents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohan Raj" }]
requires-python = ">=3.10"
dependencies = ["groundgate>=0.4"]

[project.urls]
Homepage = "https://github.com/mohanraj00/groundgate/tree/main/calibrate"
Source = "https://github.com/mohanraj00/groundgate"
Issues = "https://github.com/mohanraj00/groundgate/issues"

[project.scripts]
groundgate-calibrate = "groundgate_calibrate.cli:main"

[tool.hatch.version]
path = "src/groundgate_calibrate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/groundgate_calibrate"]

[tool.uv.sources]
groundgate = { workspace = true }
